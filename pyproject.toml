[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kytsubot"
version = "0.1.0"
description = "Async Python SDK for the KytsuBot Bot API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "KytsuBot"}]
keywords = ["kytsubot", "bot", "chatbot", "asyncio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "twine>=5.1",
]

[project.urls]
Documentation = "https://kytsubot.uz/docs/"
Repository = "https://github.com/kytsubot/kytsubot"

[tool.hatch.build.targets.wheel]
packages = ["src/kytsubot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["kytsubot"]
